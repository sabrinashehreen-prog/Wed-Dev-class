<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get Involved | Sweet Hope Desserts</title>
</head>
<body>

<header>
    <h1>Sweet Hope Desserts</h1>
</header>

<main>
    <h2>Volunteer / Donate</h2>

    <form>
        <!-- Fieldset 1 -->
        <fieldset>
            <legend>Personal Info</legend>

            <label>First Name:</label>
            <input type="text" required>

            <label>Last Name:</label>
            <input type="text" required>

            <label>Email:</label>
            <input type="email" required>

            <label>Phone:</label>
            <input type="tel">

            <label>Age:</label>
            <input type="number">
        </fieldset>

        <!-- Fieldset 2 -->
        <fieldset>
            <legend>Involvement</legend>

            <label>Volunteer Type:</label>
            <input type="text">

            <label>Availability:</label>
            <input type="text">

            <label>Donation Amount:</label>
            <input type="number">

            <label>Comments:</label>
            <textarea></textarea>

            <label>Subscribe:</label>
            <input type="checkbox">
        </fieldset>

        <button type="submit">Submit</button>
    </form>
</main>

</body>
</html>
